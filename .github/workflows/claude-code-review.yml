name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.java"
    #   - "src/**/*.kt"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # write 권한으로 변경 (인라인 코멘트용)
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리로 더 정확한 diff 분석

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이 PR에 대해 전반적인 리뷰와 라인별 상세 분석을 모두 수행하여 한글로 코드 리뷰를 작성해주세요.
            
            ## 📋 Part 1: 전반적인 코드 리뷰
            
            다음 관점에서 PR 전체를 평가:
            - 코드 품질 및 모범 사례 준수
            - 아키텍처 및 설계 패턴
            - 테스트 커버리지 및 품질
            - 문서화 수준
            
            ## 🔍 Part 2: 라인별 상세 분석
            
            ### 2-1. 변경사항 확인
            ```bash
            gh pr diff ${{ github.event.pull_request.number }} --color never
            ```
            
            ### 2-2. 각 파일별 체크리스트
            
            #### 필수 검토 항목
            - **🚨 심각한 문제** (즉시 수정 필요)
              - NullPointerException, ArrayIndexOutOfBounds
              - 메모리 누수, 무한 루프
              - SQL Injection, XSS, 하드코딩된 인증 정보
              - 데이터 무결성 위반
            
            - **⚠️ 경고** (수정 권장)
              - N+1 쿼리 문제
              - 비효율적인 알고리즘 (O(n²) 이상)
              - 부적절한 예외 처리
              - 테스트 누락
            
            - **💡 개선 제안** (선택적)
              - 코드 중복 (DRY 원칙 위반)
              - 긴 메소드 (20줄 초과)
              - 복잡한 조건문 (3중 이상 중첩)
              - 매직 넘버, 하드코딩된 값
            
            - **📝 스타일** (컨벤션)
              - 명명 규칙 위반
              - 포맷팅 이슈
              - 주석 부족
            
            ### 2-3. 라인별 코멘트 작성
            
            문제를 발견하면 다음 형식으로 구체적인 피드백 제공:
            
            ```bash
            gh pr comment ${{ github.event.pull_request.number }} --body "
            ## [이모지] [카테고리] 파일명:라인번호
            
            ### 현재 코드
            \`\`\`java
            // 실제 문제가 있는 코드
            \`\`\`
            
            ### 문제점
            - 구체적인 문제 설명
            - 발생 가능한 상황
            
            ### 개선안
            \`\`\`java
            // 개선된 코드 예시
            \`\`\`
            
            ### 설명
            - 왜 이렇게 수정해야 하는지
            - 기대 효과
            "
            ```
            
            ## 📊 Part 3: 종합 요약 리포트
            
            PR 전체에 대한 최종 종합 평가를 다음 형식으로 작성:
            
            ```bash
            gh pr comment ${{ github.event.pull_request.number }} --body "
            # 🎯 코드 리뷰 종합 결과
            
            ## 📈 전체 평가
            | 항목 | 평가 | 점수 |
            |------|------|------|
            | 코드 품질 | [평가 내용] | ⭐⭐⭐⭐☆ |
            | 설계/아키텍처 | [평가 내용] | ⭐⭐⭐⭐⭐ |
            | 성능 | [평가 내용] | ⭐⭐⭐☆☆ |
            | 보안 | [평가 내용] | ⭐⭐⭐⭐☆ |
            | 테스트 | [평가 내용] | ⭐⭐⭐☆☆ |
            
            ## 🔍 발견된 이슈 요약
            - 🚨 **심각**: [N]개 - 즉시 수정 필요
            - ⚠️ **경고**: [N]개 - 수정 권장
            - 💡 **제안**: [N]개 - 개선 가능
            - 📝 **스타일**: [N]개 - 컨벤션 관련
            
            ## 🚨 즉시 수정이 필요한 항목
            1. [파일명:라인] - [간단한 설명]
            2. [파일명:라인] - [간단한 설명]
            
            ## ✨ 잘한 점
            - [구체적인 칭찬 포인트]
            - [좋은 패턴이나 구현]
            
            ## 📋 권장 사항
            1. **단기 (이번 PR)**
               - [즉시 적용 가능한 개선사항]
            
            2. **장기 (향후 개선)**
               - [리팩토링이나 구조 개선 제안]
            
            ## ✅ 체크리스트
            - [ ] 모든 심각한 이슈 해결
            - [ ] 단위 테스트 추가/수정
            - [ ] 문서 업데이트
            - [ ] 성능 영향 검토
            - [ ] 보안 취약점 검토
            
            ---
            💬 질문이나 논의가 필요한 부분이 있다면 코멘트로 알려주세요!
            "
            ```
            
            ## 🎯 리뷰 원칙
            1. **모든 피드백은 한글로 작성**
            2. **구체적이고 실행 가능한 피드백** 제공
            3. **긍정적인 피드백도 반드시 포함**
            4. **우선순위를 명확히** 구분
            5. **학습 기회 제공** - 왜 그렇게 해야 하는지 설명
            6. **코드 예시 포함** - 개선안은 항상 코드로 보여주기
            
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.anthropic.com/en/docs/claude-code/sdk#command-line for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr review:*),Bash(gh api:*)"'

