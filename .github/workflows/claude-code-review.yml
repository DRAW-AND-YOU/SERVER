name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.java"
    #   - "src/**/*.kt"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # write 권한으로 변경 (인라인 코멘트용)
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리로 더 정확한 diff 분석
          
      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          echo "BASE_SHA=$(git merge-base HEAD origin/${{ github.base_ref }})" >> $GITHUB_ENV

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이 PR의 최신 변경사항에 대해 GitHub 인라인 리뷰를 한글로 작성해주세요.
            
            ## 🔍 Step 1: 변경사항 및 기존 리뷰 확인
            
            먼저 다음 명령들을 실행하여 현재 상태를 파악:
            
            ```bash
            # 1. PR의 최신 변경사항 확인 (최신 커밋 기준)
            gh pr diff ${{ github.event.pull_request.number }} --color never
            
            # 2. 기존에 작성된 리뷰 코멘트 확인 (중복 방지)
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --jq '.[].body' | head -20
            
            # 3. 이미 해결된 conversations 확인
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --jq '.[].state'
            ```
            
            ## 📝 Step 2: 인라인 코드 리뷰 작성
            
            GitHub의 실제 인라인 리뷰 기능을 사용하여 코드 라인에 직접 코멘트를 답니다.
            이미 리뷰한 내용은 중복해서 작성하지 마세요.
            
            ### 리뷰 시작 및 인라인 코멘트 작성 방법:
            
            ```bash
            # 리뷰 시작
            REVIEW_ID=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
              --method POST \
              --field event="COMMENT" \
              --field body="🔍 코드 리뷰를 시작합니다..." \
              --jq '.id')
            
            # 각 문제가 있는 라인에 인라인 코멘트 작성
            # 예시: 특정 파일의 특정 라인에 코멘트
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              --method POST \
              --field path="src/main/java/com/example/UserService.java" \
              --field line=45 \
              --field side="RIGHT" \
              --field body="🚨 **NPE 위험**
              
              \`user.getName()\`이 null일 수 있습니다.
              
              **개선안:**
              \`\`\`java
              Optional.ofNullable(user.getName())
                .map(String::toUpperCase)
                .orElse(\"UNKNOWN\")
              \`\`\`"
            ```
            
            ### 검토 항목별 우선순위:
            
            #### 1. 🚨 심각한 문제 (반드시 인라인 코멘트)
            - NullPointerException, ArrayIndexOutOfBounds
            - 메모리 누수, 무한 루프 가능성
            - SQL Injection, XSS 취약점
            - 하드코딩된 인증 정보
            - 데이터 무결성 위반
            
            #### 2. ⚠️ 경고 (인라인 코멘트 권장)
            - N+1 쿼리 문제
            - O(n²) 이상의 비효율적 알고리즘
            - 부적절한 예외 처리
            - 테스트 누락
            
            #### 3. 💡 개선 제안 (선택적 인라인 코멘트)
            - 코드 중복 (3회 이상)
            - 20줄 초과 메소드
            - 3중 이상 중첩 조건문
            - 매직 넘버
            
            #### 4. ✅ 칭찬 (좋은 코드에 대한 긍정 피드백)
            - 잘 작성된 패턴
            - 좋은 테스트 케이스
            - 명확한 변수명
            
            ## 📊 Step 3: 종합 리뷰 요약
            
            모든 인라인 코멘트를 작성한 후, PR 전체에 대한 종합 리뷰를 작성:
            
            ```bash
            gh pr review ${{ github.event.pull_request.number }} \
              --comment \
              --body "# 🎯 코드 리뷰 종합 결과
            
            ## 📈 전체 평가
            | 항목 | 평가 | 점수 |
            |------|------|------|
            | 코드 품질 | [평가] | ⭐⭐⭐⭐☆ |
            | 테스트 | [평가] | ⭐⭐⭐☆☆ |
            | 보안 | [평가] | ⭐⭐⭐⭐☆ |
            
            ## 🔍 발견된 이슈
            - 🚨 심각: N개 (인라인 코멘트 참조)
            - ⚠️ 경고: N개 (인라인 코멘트 참조)
            - 💡 제안: N개 (인라인 코멘트 참조)
            
            ## ✅ 잘한 점
            - [구체적인 칭찬]
            
            ## 📋 머지 전 체크리스트
            - [ ] 모든 심각한 이슈 해결
            - [ ] 테스트 추가
            - [ ] 문서 업데이트
            
            인라인 코멘트를 확인해주세요! 👆"
            ```
            
            ## 🎯 리뷰 원칙
            1. **중복 리뷰 방지**: 이미 작성된 리뷰는 다시 작성하지 않음
            2. **최신 변경사항만 리뷰**: 새로 추가되거나 수정된 코드만 검토
            3. **인라인 코멘트 우선**: 구체적인 피드백은 해당 코드 라인에 직접 작성
            4. **한글로 작성**: 모든 리뷰는 한글로 작성
            5. **건설적 피드백**: 문제점과 함께 반드시 개선안 제시
            6. **긍정적 피드백 포함**: 잘 작성된 코드도 칭찬
            
            
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.anthropic.com/en/docs/claude-code/sdk#command-line for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr review:*),Bash(gh api:*)"'

